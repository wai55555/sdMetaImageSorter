[package]
name = "sd_meta_tools"
version = "2.2.0"
edition = "2021"

[[bin]]
name = "sd_meta_sorter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
serde_json = "1.0"
fast_meta = { git = "https://github.com/wai55555/checkImageMetadata", tag = "v2.3.0" }

[profile.release]
lto = true
codegen-units = 1
strip = true
