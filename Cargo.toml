[package]
name = "sd_meta_tools"
version = "2.0.1-b"
edition = "2021"

[[bin]]
name = "sd_meta_sorter"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
serde_json = "1.0"
# fast_meta v2.2.0 の内容を隣接リポジトリから取得する（開発用）。
# タグ公開後は `{ git = "https://github.com/wai55555/checkImageMetadata", tag = "v2.2.0" }`
# へ戻す（§9.3 の版上げ原則）。
fast_meta = { path = "../checkImageMetadata" }

[profile.release]
lto = true
codegen-units = 1
strip = true
